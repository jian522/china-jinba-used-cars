<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#071827">
  <title>AI 助手 - Jinba Auto Export</title>
  <style>
    :root {
      --primary: #071827;
      --accent: #f4622b;
      --bg: #f5f5f5;
      --chat-bg: #ffffff;
      --user-msg: #95ec69;
      --bot-msg: #f0f0f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: var(--primary);
      color: white;
      padding: 16px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
    }
    .header small {
      display: block;
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 15px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end;
      background: var(--user-msg);
      border-bottom-right-radius: 4px;
    }
    .message.bot {
      align-self: flex-start;
      background: var(--bot-msg);
      border-bottom-left-radius: 4px;
    }
    .message.bot a {
      color: var(--accent);
      text-decoration: underline;
    }
    .input-container {
      background: white;
      padding: 12px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      border-top: 1px solid #e5e5e5;
    }
    .input-container input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e5e5e5;
      border-radius: 24px;
      font-size: 16px;
      outline: none;
    }
    .input-container input:focus {
      border-color: var(--accent);
    }
    .input-container button {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 24px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .input-container button:disabled {
      background: #ccc;
    }
    .typing {
      font-size: 13px;
      color: #999;
      padding: 8px 16px;
      align-self: flex-start;
    }
    .quick-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px;
      background: white;
      border-top: 1px solid #e5e5e5;
    }
    .quick-actions button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .quick-actions button:hover {
      background: var(--accent);
    }
  </style>
  <link rel="stylesheet" href="/assets/jinba-global.css?v=20260712g4">
</head>
<body>
  <div class="header">
    🤖 AI 助手
    <small>Jinba Auto Export - 中国二手车出口</small>
  </div>
  <div class="chat-container" id="chatContainer">
    <div class="message bot">你好！我是 Jinba Auto Export 的 AI 助手。🚗<br><br>我可以帮你：<br>• 查询车辆库存<br>• 介绍出口流程<br>• 解答常见问题<br><br>请告诉我你有什么需求？</div>
  </div>
  <div class="typing" id="typingIndicator" style="display:none;">正在输入...</div>
  <div class="quick-actions">
    <button onclick="sendQuick('查询车辆库存')">📋 查询库存</button>
    <button onclick="sendQuick('出口流程是什么？')">📦 出口流程</button>
    <button onclick="sendQuick('如何联系你们？')">📞 联系方式</button>
    <button onclick="sendQuick('价格怎么计算？')">💰 价格咨询</button>
  </div>
  <div class="input-container">
    <input type="text" id="userInput" placeholder="输入消息..." autocomplete="off">
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>

  <script>
    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    // Allow Enter key to send
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    function sendQuick(text) {
      userInput.value = text;
      sendMessage();
    }

    async function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      // Add user message
      addMessage(message, 'user');
      userInput.value = '';
      sendBtn.disabled = true;
      typingIndicator.style.display = 'block';

      try {
        // Call local API endpoint
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            message,
            history: getHistory()
          })
        });

        if (!response.ok) {
          throw new Error('API error');
        }

        const data = await response.json();
        addMessage(data.reply, 'bot');
        saveHistory(message, data.reply);
      } catch (error) {
        // Fallback: use DeepSeek API directly
        const reply = await queryDeepSeek(message);
        addMessage(reply, 'bot');
        saveHistory(message, reply);
      } finally {
        sendBtn.disabled = false;
        typingIndicator.style.display = 'none';
      }
    }

    async function queryDeepSeek(message) {
      // Simple response for demo
      const responses = {
        '查询车辆库存': '目前我们有 150+ 辆二手车可供出口，包括 BYD、Chery、Haval 等品牌。请访问我们的库存页面查看详情：https://jinbacars.com/en/cars/',
        '出口流程是什么？': '出口流程包括：1️⃣ 选择车辆 2️⃣ 确认报价 3️⃣ 签订协议 4️⃣ 支付定金 5️⃣ 出口清关 6️⃣ 发运至目的港',
        '如何联系你们？': '联系我们：📧 jian5222@gmail.com 📱 WhatsApp: +86 180 7908 9999 📍 中国江西省新余市',
        '价格怎么计算？': '价格包含：车辆价格 + 国内运输 + 出口报关 + 海运费。具体报价需要根据车型、数量、目的地港口计算。',
        'default': '感谢您的提问！关于 ' + message + '，请联系我们的销售团队获取详细信息。WhatsApp: +86 180 7908 9999'
      };
      
      for (const [key, value] of Object.entries(responses)) {
        if (message.includes(key) || key === 'default') {
          return value;
        }
      }
      return responses['default'];
    }

    function addMessage(text, sender) {
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.innerHTML = text.replace(/\n/g, '<br>');
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem('chatHistory') || '[]');
      } catch {
        return [];
      }
    }

    function saveHistory(userMsg, botMsg) {
      const history = getHistory();
      history.push({ role: 'user', content: userMsg });
      history.push({ role: 'assistant', content: botMsg });
      // Keep last 10 messages
      if (history.length > 20) {
        history.splice(0, history.length - 20);
      }
      localStorage.setItem('chatHistory', JSON.stringify(history));
    }
  </script>
  <script src="/assets/jinba-global.js?v=20260712g4" defer></script>
</body>
</html>
