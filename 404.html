<!doctype html>
<html lang="zh-CN" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#0b2239">
<title>页面未找到 · Jinba Auto Export</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/design-system.css?v=1">
<style>
/* 仅 404 专用布局，其余视觉全部走设计系统 token */
.notfound{
  min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:var(--s-6) var(--gutter);
  text-align:center;
}
.notfound-inner{max-width:560px}
.notfound .brand{
  display:inline-flex;align-items:center;gap:var(--s-3);
  font-weight:900;font-size:18px;color:var(--brand);
  margin-bottom:var(--s-7);
}
.notfound .mark{
  width:40px;height:40px;border-radius:var(--r-md);
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent-400) 100%);
  color:#fff;display:grid;place-items:center;font-size:19px;font-weight:900;
  box-shadow:var(--sh-glow);
}
.notfound .code{
  font-size:clamp(72px,16vw,120px);font-weight:900;line-height:1;
  color:var(--brand);letter-spacing:-0.04em;
}
.notfound .code em{color:var(--accent);font-style:normal}
.notfound h1{font-size:var(--fs-h2);margin:var(--s-4) 0 var(--s-2);color:var(--brand)}
.notfound p{color:var(--ink-500);font-size:var(--fs-body-sm);margin:0 0 var(--s-7)}
.notfound .actions{display:flex;gap:var(--s-3);justify-content:center;flex-wrap:wrap}
@media(max-width:520px){
  .notfound .actions{flex-direction:column}
  .notfound .btn{width:100%}
}
</style>
</head>
<body>
<div class="notfound">
  <div class="notfound-inner">
    <a class="brand" href="/zh/"><span class="mark">J</span><span>JINBA AUTO</span></a>
    <div class="code">4<em>0</em>4</div>
    <h1>页面未找到</h1>
    <p>抱歉，您访问的页面不存在或已被移除。请返回首页浏览最新车辆库存，或直接联系我们的出口顾问。</p>
    <div class="actions">
      <a class="btn primary" href="/zh/cars/">浏览车辆库存</a>
      <a class="btn outline" href="/zh/">返回首页</a>
      <a class="btn outline" href="https://wa.me/8618079089999">WhatsApp 咨询</a>
    </div>
  </div>
</div>
<script defer src="/assets/app.js?v=1"></script>
</body>
</html>
