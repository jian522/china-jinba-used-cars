<!doctype html>
<html lang="zh-CN" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#071827">
<title>页面未找到 · Jinba Auto Export</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#071827;--navy:#0d2944;--blue:#185381;--orange:#f4622b;--muted:#647483;--line:#dce3e8}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff;line-height:1.55;display:flex;min-height:100vh;align-items:center;justify-content:center}
.card{text-align:center;max-width:560px;padding:48px 28px}
.brand{display:inline-flex;align-items:center;gap:11px;font-weight:900;font-size:18px;margin-bottom:34px;color:var(--ink);text-decoration:none}
.mark{width:42px;height:42px;border-radius:12px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:21px}
.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.16em}
.code{font-size:clamp(72px,16vw,120px);font-weight:900;line-height:1;color:var(--ink);letter-spacing:-.04em}
.code em{color:var(--orange);font-style:normal}
h1{font-size:26px;margin:18px 0 8px}
p{color:var(--muted);font-size:15px;margin:0 0 30px}
.actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 20px;border-radius:11px;text-decoration:none;font-weight:750;font-size:14px}
.btn.primary{background:var(--ink);color:#fff}
.btn.ghost{border:1px solid var(--line);color:var(--blue)}
@media(max-width:520px){.actions{flex-direction:column}.btn{text-align:center}}
</style>
</head>
<body>
<div class="card">
  <a class="brand" href="/zh/"><span class="mark">J</span><span>JINBA AUTO<small>USED CAR EXPORT</small></span></a>
  <div class="code">4<em>0</em>4</div>
  <h1>页面未找到</h1>
  <p>抱歉，您访问的页面不存在或已被移除。请返回首页浏览最新车辆库存，或直接联系我们的出口顾问。</p>
  <div class="actions">
    <a class="btn primary" href="/zh/cars/">浏览车辆库存</a>
    <a class="btn ghost" href="/zh/">返回首页</a>
    <a class="btn ghost" href="https://wa.me/8618079089999">WhatsApp 咨询</a>
  </div>
</div>
</body>
</html>
