<section class="page-hdr"><div class="container"><h1><span data-lang="zh">关于金霸二手车?/span><span data-lang="en" style="display:none">About Jinba Auto Export</span><span data-lang="ru" style="display:none">О компании Jinba</span><span data-lang="ar" style="display:none">عن جينبا للسيارات</span></h1></div></section>

<section class="section">
  <div class="container">
    <div class="about-story">
      <div>
        <h2 data-lang="zh">我们的故事?/h2><h2 data-lang="en" style="display:none">Our Story</h2><h2 data-lang="ru" style="display:none">Наша история</h2><h2 data-lang="ar" style="display:none">قصتنا</h2>
        <p data-lang="zh">金霸二手车始车?000年代，深耕江西新余二手车市场20余年。从一家本地二手车行起步，逐步发展为中国专业的二手车出口平台口?/p>
        <p data-lang="en" style="display:none">Jinba Auto Export started in the 2000s, deeply rooted in Xinyu, Jiangxi's used car market for over 20 years. From a local dealership to a professional Chinese used car export platform.</p>
        <p data-lang="ru" style="display:none">Jinba Auto Export начинала в 2000-х годах, более 20 лет в сфере подержанных автомобилей в Синьюе, Цзянси. От местного дилера до профессионального экспортёра.</p>
        <p data-lang="ar" style="display:none">بدأت جينبا للسيارات في العقد الأول من القرن الحادي والعشرين، مع أكثر من 20 عاماً في سوق السيارات المستعملة في شينيو، جيانغشي.</p>
        <p data-lang="zh">我们专注于中国二手车及新能源车出口服务，涵盖比亚迪、MG名爵、奇瑞、哈弗、理想、问界等热门品牌。凭借丰富的行业经验、严格的车辆检测体系和专业的出口服务团队，金霸已成功将车辆出口至俄罗斯、哈萨克斯坦、阿联酋、沙特、埃及、尼日利亚、乌兹别克斯坦等50多个国家和地区"?/p>
        <p data-lang="en" style="display:none">We specialize in Chinese used car and NEV export, covering BYD, MG, Chery, Haval, Li Auto, AITO and more. With extensive experience, strict inspection systems, and professional export services, Jinba has exported to 50+ countries.</p>
        <p data-lang="ru" style="display:none">Мы специализируемся на экспорте китайских автомобилей и NEV: BYD, MG, Chery, Haval, Li Auto, AITO. Jinba экспортирует в 50+ стран.</p>
        <p data-lang="ar" style="display:none">نحن متخصصون في تصدير السيارات الصينية المستعملة والجديدة: BYD، MG، Chery، Haval، Li Auto، AITO. صدّرنا إلى أكثر من 50 دولة.</p>
      </div>

  </div>
</section>
